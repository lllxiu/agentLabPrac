spring.application.name=backend_practice
server.address = 127.0.0.1
server.port = 8089

spring.datasource.url=jdbc:mysql://localhost:3306/agent_springboot?characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai
spring.datasource.username=aiTest
spring.datasource.password=${MYSQL_PASSWORD}

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

spring.ai.deepseek.base-url=${AI_BASE_URL}
spring.ai.deepseek.api-key=${AI_API_KEY}
spring.ai.deepseek.chat.model=${AI_MODEL}
spring.ai.deepseek.chat.completions-path=/chat/completions

spring.ai.deepseek.chat.thinking.type=disabled
spring.ai.deepseek.chat.max-tokens=1024
spring.ai.retry.max-attempts=1